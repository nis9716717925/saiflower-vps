# Nginx site config for saiflower.com (VPS).
# Install: ln -sf /var/www/saiflower-vps/deploy/nginx/saiflower.com.conf /etc/nginx/sites-enabled/saiflower.com

server {
    listen 80;
    listen [::]:80;
    server_name saiflower.com www.saiflower.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saiflower.com www.saiflower.com;

    ssl_certificate /etc/letsencrypt/live/saiflower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saiflower.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /var/www/saiflower-vps/deploy/nginx/next-static.conf;
    include /var/www/saiflower-vps/deploy/nginx/uploads.conf;
    include /var/www/saiflower-vps/deploy/nginx/php-admin.conf;

    location = /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
