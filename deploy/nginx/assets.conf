# Serve legacy static assets from disk (bypass Node proxy).
# Include inside the saiflower.com server { } block, BEFORE location /.

# Icon fonts — immutable filenames, long cache (must be before general /assets/)
location ^~ /assets/vendor/ {
  alias /var/www/saiflower-vps/apps/web/public/assets/vendor/;
  access_log off;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
}

# Serve legacy static assets from disk (bypass Node proxy).
# Include inside the saiflower.com server { } block, BEFORE location /.

location ^~ /assets/ {
  alias /var/www/saiflower-vps/apps/web/public/assets/;
  access_log off;
  expires 7d;
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  add_header X-Content-Type-Options nosniff always;
}
