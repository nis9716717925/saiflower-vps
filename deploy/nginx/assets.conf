# Serve legacy static assets from disk (bypass Node proxy).
# Include inside the saiflower.com server { } block, BEFORE location /.

location ^~ /assets/ {
  alias /var/www/saiflower-vps/apps/web/public/assets/;
  access_log off;
  expires 7d;
  add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  add_header X-Content-Type-Options nosniff always;
}
