# Serve product images directly from disk (fast, no Node proxy).
# Include inside your saiflower.com server block BEFORE location /.

location /uploads/ {
    alias /var/www/saiflower-vps/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
