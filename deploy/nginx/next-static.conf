# Serve Next.js static assets directly (faster + avoids proxy chunk errors).
# Include inside your saiflower.com server { } block, BEFORE location /.

location /_next/static/ {
  alias /var/www/saiflower-vps/apps/web/.next/static/;
  access_log off;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable";
}
