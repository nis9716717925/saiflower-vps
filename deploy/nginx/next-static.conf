# Serve Next.js hashed assets from disk (never proxy them to Node).
# Include inside the saiflower.com server { } block, BEFORE location /.
#
# Why ^~ : wins over regex locations and does not fall through to the
# Next.js proxy. A missing file returns nginx 404 instead of Next HTML 400
# (which browsers surface as a client-side "Application error").

location ^~ /_next/static/ {
  alias /var/www/saiflower-vps/apps/web/.next/static/;
  access_log off;
  expires 365d;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
}
